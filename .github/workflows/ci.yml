name: CI

on:
  push:
    branches: [main, windows-mvp]
    # A version tag (v1.0.0, v1.1.0, ...) also publishes a GitHub release.
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.8
          channel: stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apps Script tests
        run: node --test 'apps_script/test/*.test.js'
      - name: Analyze
        working-directory: app
        run: flutter analyze
      - name: Flutter tests
        working-directory: app
        run: flutter test

  windows:
    runs-on: windows-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.8
          channel: stable
      - name: Build Windows app
        working-directory: app
        run: flutter build windows --release
      - uses: actions/upload-artifact@v4
        with:
          name: PilotLogbook-windows
          path: app/build/windows/x64/runner/Release/

  android:
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.8
          channel: stable
      # One signing key for every build, so a new APK installs over the old
      # one. The ANDROID_KEYSTORE_BASE64 / ANDROID_KEYSTORE_PASSWORD secrets
      # win; without them a key is made once and kept in the Actions cache.
      - uses: actions/cache@v4
        with:
          path: ~/.pilotlogbook-signing
          key: android-signing-v1
      - name: Signing key
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        working-directory: app/android
        run: |
          dir=~/.pilotlogbook-signing
          if [ -n "$KEYSTORE" ]; then
            echo "$KEYSTORE" | base64 -d > app/release.jks
          else
            mkdir -p "$dir"
            if [ ! -f "$dir/release.jks" ]; then
              head -c 24 /dev/urandom | base64 | tr -d '/+=' > "$dir/password"
              keytool -genkeypair -keystore "$dir/release.jks" -storetype PKCS12 \
                -alias pilotlogbook -keyalg RSA -keysize 2048 -validity 10000 \
                -storepass "$(cat "$dir/password")" -dname "CN=Pilot Logbook"
            fi
            cp "$dir/release.jks" app/release.jks
            PASSWORD=$(cat "$dir/password")
          fi
          printf 'storeFile=release.jks\nstorePassword=%s\nkeyAlias=pilotlogbook\nkeyPassword=%s\n' "$PASSWORD" "$PASSWORD" > key.properties
      - name: Build APK
        working-directory: app
        run: |
          flutter build apk --release --build-number=${{ github.run_number }}
          cp build/app/outputs/flutter-apk/app-release.apk PilotLogbook.apk
      - uses: actions/upload-artifact@v4
        with:
          name: PilotLogbook-android
          path: app/PilotLogbook.apk
      # A fixed download link for phones: Releases -> android-latest.
      - name: Publish android-latest release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: Android (latest build)
          prerelease: true
          make_latest: false
          files: app/PilotLogbook.apk
          body: Built from ${{ github.sha }} on ${{ github.ref_name }}.

  # On a version tag: one release with the Windows zip and the Android APK.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: [windows, android]
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: PilotLogbook-windows
          path: PilotLogbook
      - uses: actions/download-artifact@v4
        with:
          name: PilotLogbook-android
          path: .
      - name: Pack Windows zip
        run: |
          zip -qr "PilotLogbook-windows-${GITHUB_REF_NAME}.zip" PilotLogbook
          mv PilotLogbook.apk "PilotLogbook-android-${GITHUB_REF_NAME}.apk"
      - uses: softprops/action-gh-release@v2
        with:
          name: Pilot Logbook ${{ github.ref_name }}
          make_latest: true
          generate_release_notes: true
          files: |
            PilotLogbook-windows-${{ github.ref_name }}.zip
            PilotLogbook-android-${{ github.ref_name }}.apk
          body: |
            **Windows:** pobierz `PilotLogbook-windows-${{ github.ref_name }}.zip`, rozpakuj i uruchom `PilotLogbook\pilot_logbook.exe`.
            **Android:** pobierz `PilotLogbook-android-${{ github.ref_name }}.apk` na telefonie i zainstaluj (zezwól na instalację z tego źródła).
